<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصّة القمة — بروفايلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF3E4; --bg-soft:#F3E9D4; --panel:#FFFDF8;
    --ink:#1C2A2C; --ink-soft:#5B6664;
    --gold:#B98A2E; --gold-soft:#E6C77E;
    --teal:#0F6156; --teal-deep:#0A4740;
    --line:rgba(28,42,44,0.14);
    --shadow:0 20px 45px -25px rgba(20,30,25,0.35);
    --danger:#A23B3B; --danger-soft:rgba(162,59,59,0.12);
    --success:#1F7A54;
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#10171A; --bg-soft:#151E21; --panel:#1A2528;
    --ink:#F1E9D6; --ink-soft:#B7C2BE;
    --gold:#E0BB63; --gold-soft:#8A6C2C;
    --teal:#3FB39C; --teal-deep:#1C6E60;
    --line:rgba(241,233,214,0.14);
    --shadow:0 24px 55px -25px rgba(0,0,0,0.6);
    --danger:#E27A7A; --danger-soft:rgba(226,122,122,0.14);
    --success:#5FCB9B;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Cairo', sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    transition:background .5s ease, color .5s ease;
  }

  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:var(--panel); border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    font-family:'Aref Ruqaa', serif; font-size:23px;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-word{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{
    width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg-soft); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .35s ease, background .4s ease;
  }
  .theme-toggle:hover{ transform:translateY(-2px) rotate(8deg); }
  .theme-toggle svg{ width:19px; height:19px; }
  .icon-sun{ display:none; }
  html[data-theme="dark"] .icon-moon{ display:none; }
  html[data-theme="dark"] .icon-sun{ display:block; }

  .page-wrap{ max-width:600px; margin:0 auto; padding:40px 24px 80px; }

  .profile-head{ display:flex; align-items:center; gap:16px; margin-bottom:28px; opacity:0; transform:translateY(10px); animation:fadeUp .55s ease forwards .05s; }
  .profile-avatar{
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:24px;
  }
  .profile-name{ font-family:'Aref Ruqaa', serif; font-size:26px; margin:0; }
  .profile-role{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:26px 24px; box-shadow:var(--shadow); margin-bottom:20px;
    opacity:0; transform:translateY(14px); animation:fadeUp .55s ease forwards .15s;
  }
  .card h3{ margin:0 0 18px; font-family:'Aref Ruqaa', serif; font-size:19px; }

  .info-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
  .info-row:last-child{ border-bottom:none; }
  .info-label{ font-size:13px; color:var(--ink-soft); }
  .info-value{ font-size:14px; font-weight:700; }

  .field{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
  .field label{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .field input, .field select{
    font-family:'Cairo', sans-serif; font-size:14.5px; padding:12px 15px;
    border-radius:11px; border:1.5px solid var(--line); background:var(--bg-soft); color:var(--ink);
    outline:none; width:100%;
    transition:border-color .2s ease, box-shadow .2s ease, background .3s ease;
  }
  .field input:focus, .field select:focus{
    border-color:var(--teal); box-shadow:0 0 0 4px rgba(15,97,86,0.15); background:var(--panel);
  }
  .field input:disabled{ opacity:.6; }
  .field-error{ font-size:12px; color:var(--danger); min-height:14px; }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    border:none; border-radius:11px; padding:12px 20px; font-family:'Cairo', sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .2s ease, filter .2s ease, background .2s ease;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#FBF6E8; }
  .btn-primary:hover:not(:disabled){ transform:translateY(-2px); filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:.7; cursor:not-allowed; }
  .btn-ghost{ background:var(--bg-soft); color:var(--ink); }
  .btn-ghost:hover{ background:var(--line); }

  .form-message{
    font-size:13.5px; border-radius:10px; padding:0; max-height:0; overflow:hidden; opacity:0;
    transition:all .35s ease;
  }
  .form-message.show{ padding:11px 14px; max-height:80px; opacity:1; margin-top:14px; }
  .form-message.error{ background:var(--danger-soft); color:var(--danger); border:1px solid rgba(162,59,59,0.25); }
  .form-message.success{ background:rgba(31,122,84,0.12); color:var(--success); border:1px solid rgba(31,122,84,0.25); }

  @media (max-width: 640px){
    .topbar{ padding:12px 16px; }
    .brand-word{ display:none; }
    .page-wrap{ padding:30px 16px 60px; }
    .card{ padding:20px 16px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">القمة</span>
      <span class="brand-word">مِنصّة القمة لتعليم اللغة العربية</span>
    </div>
    <div class="topbar-actions">
      <span id="gnavMount"></span>
      <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي/النهاري">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="page-wrap">
    <div class="profile-head">
      <span class="profile-avatar" id="pAvatar"></span>
      <div>
        <h1 class="profile-name" id="pName">...</h1>
        <div class="profile-role" id="pRole"></div>
      </div>
    </div>

    <div class="card" id="infoCard">
      <h3>بياناتي</h3>
      <div class="info-row"><span class="info-label">الإيميل</span><span class="info-value" id="pEmail">—</span></div>
      <div class="info-row"><span class="info-label">الهاتف</span><span class="info-value" id="pPhone">—</span></div>
      <div class="info-row" id="pYearRow"><span class="info-label">الصف الدراسي</span><span class="info-value" id="pYear">—</span></div>
    </div>

    <div class="card">
      <h3>تعديل بياناتي</h3>
      <form id="editForm">
        <div class="field">
          <label for="fName">الاسم</label>
          <input type="text" id="fName" placeholder="اسمك">
          <span class="field-error" id="nameError"></span>
        </div>
        <div class="field" id="yearField">
          <label for="fYear">الصف الدراسي</label>
          <select id="fYear">
            <option value="1">الصف الأول الإعدادي</option>
            <option value="2">الصف الثاني الإعدادي</option>
            <option value="3">الصف الثالث الإعدادي</option>
            <option value="4">الصف الأول الثانوي</option>
            <option value="5">الصف الثاني الثانوي</option>
            <option value="6">الصف الثالث الثانوي</option>
          </select>
        </div>
        <div class="field">
          <label for="fPhone">رقم الهاتف</label>
          <input type="tel" id="fPhone" placeholder="01xxxxxxxxx">
          <span class="field-error" id="phoneError"></span>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="saveBtn">حفظ التعديلات</button>
        </div>
        <div class="form-message" id="formMessage" role="alert"></div>
      </form>
    </div>
  </div>

<script src="../Shared/browser-guard.js"></script>
<script src="../Shared/config.js"></script>
<script src="../Shared/nav.js"></script>
<script src="./main.js"></script>
</body>
</html>
