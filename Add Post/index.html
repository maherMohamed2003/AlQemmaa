<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصّة القمة — إضافة بوست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF3E4; --bg-soft:#F3E9D4; --panel:#FFFDF8;
    --ink:#1C2A2C; --ink-soft:#5B6664;
    --gold:#B98A2E; --gold-soft:#E6C77E;
    --teal:#0F6156; --teal-deep:#0A4740;
    --line:rgba(28,42,44,0.14);
    --shadow:0 20px 45px -25px rgba(20,30,25,0.35);
    --danger:#A23B3B; --danger-soft:rgba(162,59,59,0.12);
    --success:#1F7A54;
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#10171A; --bg-soft:#151E21; --panel:#1A2528;
    --ink:#F1E9D6; --ink-soft:#B7C2BE;
    --gold:#E0BB63; --gold-soft:#8A6C2C;
    --teal:#3FB39C; --teal-deep:#1C6E60;
    --line:rgba(241,233,214,0.14);
    --shadow:0 24px 55px -25px rgba(0,0,0,0.6);
    --danger:#E27A7A; --danger-soft:rgba(226,122,122,0.14);
    --success:#5FCB9B;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Cairo', sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    transition:background .5s ease, color .5s ease;
  }

  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:var(--panel); border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    font-family:'Aref Ruqaa', serif; font-size:23px;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-word{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px;
    font-size:13.5px; font-weight:700; color:var(--ink-soft); text-decoration:none;
    padding:9px 14px; border-radius:10px; border:1px solid var(--line);
    transition:background .2s ease, color .2s ease;
  }
  .back-link:hover{ background:var(--bg-soft); color:var(--ink); }
  .back-link svg{ width:16px; height:16px; }
  .theme-toggle{
    width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg-soft); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .35s ease, background .4s ease;
  }
  .theme-toggle:hover{ transform:translateY(-2px) rotate(8deg); }
  .theme-toggle svg{ width:19px; height:19px; }
  .icon-sun{ display:none; }
  html[data-theme="dark"] .icon-moon{ display:none; }
  html[data-theme="dark"] .icon-sun{ display:block; }

  .page-wrap{ max-width:640px; margin:0 auto; padding:40px 24px 80px; }

  .page-title-wrap{ margin-bottom:26px; opacity:0; transform:translateY(10px); animation:fadeUp .55s ease forwards .05s; }
  .eyebrow{ display:inline-block; font-size:12.5px; letter-spacing:.5px; font-weight:700; color:var(--teal); margin-bottom:8px; }
  .page-title{ font-family:'Aref Ruqaa', serif; font-size:32px; margin:0; position:relative; display:inline-block; }
  .underline-ink{ display:block; width:150px; height:13px; margin-top:-3px; }
  .underline-ink path{
    fill:none; stroke:var(--gold); stroke-width:4; stroke-linecap:round;
    stroke-dasharray:220; stroke-dashoffset:220; animation:draw 1s ease forwards .4s;
  }
  .page-sub{ font-size:14px; color:var(--ink-soft); margin:8px 0 0; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }

  .form-card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:30px 28px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(14px); animation:fadeUp .55s ease forwards .15s;
  }

  .field{ display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
  .field label{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .field textarea{
    font-family:'Cairo', sans-serif; font-size:14.5px; padding:12px 15px;
    border-radius:11px; border:1.5px solid var(--line); background:var(--bg-soft); color:var(--ink);
    outline:none; width:100%; resize:vertical; min-height:140px;
    transition:border-color .2s ease, box-shadow .2s ease, background .3s ease;
  }
  .field textarea:focus{
    border-color:var(--teal); box-shadow:0 0 0 4px rgba(15,97,86,0.15); background:var(--panel);
  }
  .field.invalid textarea{ border-color:var(--danger); }
  .field-error{ font-size:12px; color:var(--danger); min-height:14px; }

  .submit-btn{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#FBF6E8;
    font-family:'Cairo', sans-serif; font-weight:700; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:transform .2s ease, filter .2s ease;
  }
  .submit-btn:hover:not(:disabled){ transform:translateY(-2px); filter:brightness(1.06); }
  .submit-btn:disabled{ opacity:.7; cursor:not-allowed; }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.4); border-top-color:#fff;
    display:none; animation:spin .8s linear infinite;
  }
  .submit-btn.loading .spinner{ display:inline-block; }
  .submit-btn.loading .btn-label{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .form-message{
    font-size:13.5px; border-radius:10px; padding:0; max-height:0; overflow:hidden; opacity:0;
    transition:all .35s ease;
  }
  .form-message.show{ padding:11px 14px; max-height:80px; opacity:1; margin-top:14px; }
  .form-message.error{ background:var(--danger-soft); color:var(--danger); border:1px solid rgba(162,59,59,0.25); }

  .success-card{ display:none; text-align:center; padding:20px 10px; }
  .success-card.show{ display:block; animation:fadeUp .5s ease forwards; }
  .success-icon{
    width:66px; height:66px; border-radius:50%; margin:0 auto 16px;
    background:rgba(31,122,84,0.12); color:var(--success);
    display:flex; align-items:center; justify-content:center;
  }
  .success-icon svg{ width:30px; height:30px; }
  .success-title{ font-family:'Aref Ruqaa', serif; font-size:24px; margin:0 0 8px; }
  .success-text{ font-size:14px; color:var(--ink-soft); margin:0 0 22px; line-height:1.8; }
  .success-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn{
    border:none; border-radius:11px; padding:12px 20px; font-family:'Cairo', sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .2s ease, filter .2s ease, background .2s ease;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#FBF6E8; }
  .btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.06); }
  .btn-ghost{ background:var(--bg-soft); color:var(--ink); }
  .btn-ghost:hover{ background:var(--line); }

  @media (max-width: 640px){
    .topbar{ padding:12px 16px; }
    .brand-word{ display:none; }
    .page-wrap{ padding:30px 16px 60px; }
    .form-card{ padding:24px 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">القمة</span>
      <span class="brand-word">مِنصّة القمة لتعليم اللغة العربية</span>
    </div>
    <div class="topbar-actions">
      <span id="gnavMount"></span>
      <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي/النهاري">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="page-wrap">
    <div class="page-title-wrap">
      <span class="eyebrow">لوحة التحكم</span>
      <h1 class="page-title">إضافة بوست جديد
        <svg class="underline-ink" viewBox="0 0 150 13" aria-hidden="true"><path d="M3 7c20-5 40-5 60-1s50 4 84-2"/></svg>
      </h1>
      <p class="page-sub">اكتب تحديثًا يظهر مباشرة لكل الطلاب في الصفحة الرئيسية</p>
    </div>

    <div class="form-card" id="formCard">
      <form id="addPostForm" novalidate>
        <div class="field" id="contentField">
          <label for="postContent">محتوى البوست</label>
          <textarea id="postContent" placeholder="اكتب تحديثك هنا..."></textarea>
          <span class="field-error" id="contentError"></span>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-label">نشر البوست</span>
        </button>

        <div class="form-message" id="formMessage" role="alert"></div>
      </form>

      <div class="success-card" id="successCard">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h2 class="success-title">تم نشر البوست بنجاح</h2>
        <p class="success-text">هيظهر البوست دلوقتي لكل الطلاب في الصفحة الرئيسية.</p>
        <div class="success-actions">
          <a class="btn btn-primary" href="../Home/home.html">عرض الصفحة الرئيسية</a>
          <button type="button" class="btn btn-ghost" id="addAnotherBtn">إضافة بوست تاني</button>
        </div>
      </div>
    </div>
  </div>

<script src="../Shared/config.js"></script>
<script src="../Shared/nav.js"></script>
  <script src="../Shared/contact-widget.js"></script>
<script src="./main.js"></script>
</body>
</html>
