<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصّة القمة — إضافة درس جديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">القمة</span>
      <span class="brand-word">مِنصّة القمة لتعليم اللغة العربية</span>
    </div>
    <div class="topbar-actions">
      <span id="gnavMount"></span>
      <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي/النهاري">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="page-wrap">
    <div class="page-title-wrap">
      <span class="eyebrow">لوحة التحكم</span>
      <h1 class="page-title">إضافة درس جديد
        <svg class="underline-ink" viewBox="0 0 150 13" aria-hidden="true"><path d="M3 7c20-5 40-5 60-1s50 4 84-2"/></svg>
      </h1>
      <p class="page-sub">ارفع فيديو الدرس واكتب بياناته ليظهر مباشرة لطلابك</p>
    </div>

    <div class="form-card">
      <form id="addLessonForm" novalidate>
        <div class="field" id="titleField">
          <label for="lessonTitle">عنوان الدرس</label>
          <input type="text" id="lessonTitle" placeholder="مثال: درس الإعراب - الجزء الأول">
          <span class="field-error" id="titleError"></span>
        </div>

        <div class="field" id="descField">
          <label for="lessonDesc">وصف الدرس</label>
          <textarea id="lessonDesc" placeholder="اكتب وصفًا مختصرًا لمحتوى الدرس..."></textarea>
          <span class="field-error" id="descError"></span>
        </div>

        <div class="field" id="videoField">
          <label>فيديو الدرس</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="videoInput" accept="video/*">
            <div class="dz-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            </div>
            <div class="dz-title">اسحب الفيديو هنا أو <span class="dz-browse">اختر ملفًا</span></div>
            <div class="dz-sub">صيغ الفيديو المدعومة، بحد أقصى حسب سعة الخادم</div>
          </div>

          <div class="file-chip" id="fileChip">
            <div class="file-chip-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </div>
            <div class="file-chip-info">
              <div class="file-chip-name" id="fileChipName"></div>
              <div class="file-chip-size" id="fileChipSize"></div>
            </div>
            <button type="button" class="file-chip-remove" id="fileChipRemove" aria-label="إزالة الملف">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="video-preview" id="videoPreview">
            <video id="videoPreviewEl" controls></video>
          </div>

          <div class="upload-progress" id="uploadProgress">
            <div class="upload-progress-bar" id="uploadProgressBar"></div>
          </div>

          <span class="field-error" id="videoError"></span>
        </div>

        <div class="field" id="yearField">
          <label for="lessonYear">الصف الدراسي</label>
          <select id="lessonYear" required>
            <option value="" disabled selected>اختر الصف الدراسي</option>
            <option value="1">الصف الأول الإعدادي</option>
            <option value="2">الصف الثاني الإعدادي</option>
            <option value="3">الصف الثالث الإعدادي</option>
            <option value="4">الصف الأول الثانوي</option>
            <option value="5">الصف الثاني الثانوي</option>
            <option value="6">الصف الثالث الثانوي</option>
          </select>
          <span class="field-error" id="yearError"></span>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">نشر الدرس</span>
          <span class="spinner" id="submitSpinner" hidden></span>
        </button>

        <div class="form-message" id="formMessage" role="alert"></div>
      </form>

      <div class="success-card" id="successCard">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h2 class="success-title">تم نشر الدرس بنجاح</h2>
        <p class="success-text">الدرس أصبح متاحًا الآن ضمن قائمة الدروس.</p>
        <div class="success-actions">
          <a class="btn btn-primary" href="../Lessons-List/lessons.html">عرض كل الدروس</a>
          <button class="btn btn-ghost" id="addAnotherBtn">إضافة درس آخر</button>
        </div>
      </div>
    </div>
  </div>

<script src="../Shared/config.js"></script>
<script src="../Shared/nav.js"></script>
<script src="./main.js"> </script>
  <script src="../Shared/contact-widget.js"></script>
</body>
</html>
